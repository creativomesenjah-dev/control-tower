# Compila "Control Tower" para macOS en los servidores de GitHub.
# Cada push genera un .dmg descargable desde la pestaña "Actions".
# Al crear un tag que empiece con "v" (por ejemplo v0.1.0) además publica un Release.
name: Compilar para macOS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas de DSP y decks
        run: |
          clang++ -O2 -std=c++17 -ISource tests/dsp_test.cpp -o dsp_test
          ./dsp_test

      - name: Configurar (universal Intel + Apple Silicon, macOS 10.13 o superior)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCT_TESTS=ON

      - name: Compilar
        run: cmake --build build --config Release -j 4

      - name: Prueba del motor completo
        run: |
          mkdir -p test-out
          ./build/EngineTest_artefacts/Release/EngineTest test-out

      - name: Firmar (ad-hoc) y verificar
        run: |
          APP="build/ControlTower_artefacts/Release/Control Tower.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          lipo -info "$APP/Contents/MacOS/Control Tower"
          otool -arch x86_64 -l "$APP/Contents/MacOS/Control Tower" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos|version" | head -2

      - name: Armar el .dmg
        run: |
          mkdir -p dmg
          cp -R "build/ControlTower_artefacts/Release/Control Tower.app" dmg/
          ln -s /Applications dmg/Applications
          cp docs/LEEME.txt dmg/LEEME.txt
          hdiutil create -volname "Control Tower" -srcfolder dmg -ov -format UDZO ControlTower.dmg

      - name: Subir el .dmg
        uses: actions/upload-artifact@v4
        with:
          name: ControlTower-macOS
          path: ControlTower.dmg

      - name: Subir la demo de audio de la prueba
        uses: actions/upload-artifact@v4
        with:
          name: demo-audio
          path: test-out/preamp_demo.wav

      - name: Publicar Release (sólo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ControlTower.dmg \
            --title "Control Tower ${GITHUB_REF_NAME}" \
            --notes "Descargá ControlTower.dmg, abrilo y arrastrá Control Tower a Aplicaciones. La primera vez: clic derecho > Abrir."
